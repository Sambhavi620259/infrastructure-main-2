# Local backend + database. Copy .env.example to .env and set POSTGRES_PASSWORD and JWT_SECRET first.

services:
  db:
    image: postgres:15-alpine
    container_name: itam_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-itam_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itam_user} -d ${POSTGRES_DB:-itam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: itam_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-itam_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itam_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
