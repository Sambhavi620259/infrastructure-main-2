# Local backend/database services go here.

services:
  db:
    image: postgres:15-alpine
    container_name: itam_postgres
    restart: always
    environment:
      POSTGRES_USER: itam_user
      POSTGRES_PASSWORD: itam_password
      POSTGRES_DB: itam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itam_user -d itam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: itam_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+psycopg2://itam_user:itam_password@db:5432/itam_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
