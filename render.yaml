# Render Blueprint: the FastAPI backend and its PostgreSQL database.
# In Render: New > Blueprint > pick this repository. The frontend goes on Vercel
# (see README "Deploying"). Fill CORS_ORIGINS with the Vercel address when asked.
services:
  - type: web
    name: itam-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: itam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: itam-db
    plan: free
    databaseName: itam_db
    user: itam_user
