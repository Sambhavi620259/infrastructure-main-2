# Render Blueprint: the FastAPI backend and its PostgreSQL database.
# In Render: New > Blueprint > pick this repository. The frontend goes on Vercel
# (see README "Deploying"). Fill CORS_ORIGINS with the Vercel address when asked.
services:
  - type: web
    name: itam-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: itam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Proxies in front of the app that each add to X-Forwarded-For: the Vercel
      # proxy puts the visitor's address first and Render adds Vercel's address.
      # Used for sign-in rate limits; use 1 if the frontend is not on Vercel.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      # Optional but recommended: the same secret as BACKEND_PROXY_KEY on Vercel. With it, only the
      # Vercel proxy can name the visitor's address for the sign-in limits.
      - key: PROXY_SHARED_SECRET
        sync: false
      # Who may sign up without being added. IT Admins and users are created by the Super Admin
      # (Add IT Admin / Add user), so IT Admin and user sign-up are closed by default.
      - key: ALLOW_PUBLIC_IT_ADMIN_SIGNUP
        value: "false"
      - key: ALLOW_PUBLIC_AGENT_SIGNUP
        value: "false"
      - key: ALLOW_PUBLIC_SUPER_ADMIN_SIGNUP
        value: "false"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: itam-db
    plan: free
    databaseName: itam_db
    user: itam_user
